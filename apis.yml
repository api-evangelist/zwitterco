name: Zwitterco
description: >-
  ZwitterCo is an advanced water treatment company that manufactures filtration
  membranes based on zwitterionic chemistry, a surface science that makes
  membranes attract water rather than organic compounds and thereby resist the
  organic fouling that limits conventional membranes. Its product families
  target food and dairy processing (Evolution membranes for whey and milk
  concentration), industrial and municipal wastewater (Elevation membranes for
  landfill leachate, refinery streams, and produced water), and extreme
  high-fouling waste streams (Expedition superfiltration). ZwitterCo is a DCVC
  portfolio company. It sells physical membrane hardware and treatment systems
  through direct sales and does not currently publish any public developer
  portal, API, SDKs, or machine-readable interface; this profile is a company
  record in the API Evangelist network rather than an API producer.
